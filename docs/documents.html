<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>SiteLog — Documents</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <style>
    :root {
      --bg: #f2f2f7;
      --surface: #ffffff;
      --surface2: #f9f9fb;
      --surface3: #f2f2f7;
      --border: rgba(0,0,0,0.08);
      --border-heavy: rgba(0,0,0,0.13);
      --blue: #004a99;
      --blue-dark: #003a78;
      --blue-soft: rgba(0,74,153,0.10);
      --red: #ff3b30;
      --red-soft: rgba(255,59,48,0.10);
      --green: #34c759;
      --green-soft: rgba(52,199,89,0.10);
      --amber: #ff9f0a;
      --amber-soft: rgba(255,159,10,0.10);
      --label: #1d1d1f;
      --label2: #48484a;
      --label3: #6e6e73;
      --label4: #aeaeb2;
      --radius-sm: 8px;
      --radius-md: 12px;
      --radius-lg: 16px;
      --radius-xl: 20px;
      --shadow-md: 0 4px 16px rgba(0,0,0,0.08), 0 1px 4px rgba(0,0,0,0.04);
      --shadow-xl: 0 20px 60px rgba(0,0,0,0.18), 0 4px 16px rgba(0,0,0,0.08);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { -webkit-font-smoothing: antialiased; }

    body {
      font-family: "DM Sans", -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg);
      color: var(--label);
      min-height: 100vh;
      padding-bottom: 60px;
    }

    /* TOPBAR */
    .topbar {
      background: rgba(255,255,255,0.92);
      backdrop-filter: blur(20px) saturate(180%);
      border-bottom: 1px solid var(--border);
      position: sticky; top: 0; z-index: 100;
      padding: 0 20px;
      height: 52px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    .topbar-brand { display: flex; align-items: center; gap: 10px; }
    .topbar-logo img { height: 28px; border-radius: 5px; display: block; }
    .topbar-title { font-size: 15px; font-weight: 600; letter-spacing: -0.2px; }
    .topbar-subtitle { font-size: 12px; color: var(--label3); }

    /* TABS */
    .tab-bar {
      display: flex;
      padding: 0 20px;
      border-bottom: 1px solid var(--border);
      background: var(--surface);
      position: sticky; top: 52px; z-index: 90;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
    }
    .tab-btn {
      padding: 13px 18px;
      font-size: 14px; font-weight: 500;
      color: var(--label3);
      border: none; background: none; cursor: pointer;
      border-bottom: 2px solid transparent;
      margin-bottom: -1px;
      white-space: nowrap;
      transition: color 0.15s, border-color 0.15s;
    }
    .tab-btn.active { color: var(--blue); border-bottom-color: var(--blue); font-weight: 600; }

    /* PAGE */
    .page { max-width: 820px; margin: 0 auto; padding: 24px 20px 0; }

    /* CARDS */
    .card {
      background: var(--surface);
      border-radius: var(--radius-xl);
      box-shadow: var(--shadow-md);
      border: 1px solid var(--border);
      overflow: hidden;
      margin-bottom: 20px;
    }
    .card-header {
      padding: 16px 20px;
      border-bottom: 1px solid var(--border);
      background: var(--surface2);
    }
    .card-title { font-size: 15px; font-weight: 600; }
    .card-subtitle { font-size: 12px; color: var(--label3); margin-top: 3px; }
    .card-body { padding: 20px; }

    /* FORM */
    .field-group { margin-bottom: 14px; }
    .field-label {
      display: block;
      font-size: 11px; font-weight: 600;
      color: var(--label3);
      text-transform: uppercase; letter-spacing: 0.5px;
      margin-bottom: 5px;
    }

    input[type="text"],
    input[type="date"],
    input[type="time"],
    input[type="number"],
    input[type="tel"],
    textarea,
    select {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid var(--border-heavy);
      border-radius: var(--radius-sm);
      font-size: 14px; font-family: inherit;
      color: var(--label); background: var(--surface);
      outline: none;
      transition: border-color 0.15s, box-shadow 0.15s;
      -webkit-appearance: none; appearance: none;
    }
    input:focus, textarea:focus, select:focus {
      border-color: var(--blue);
      box-shadow: 0 0 0 3px var(--blue-soft);
    }
    select { -webkit-appearance: menulist; appearance: menulist; }
    textarea { resize: vertical; min-height: 72px; line-height: 1.5; }

    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 14px; }
    .form-row.three { grid-template-columns: 1fr 1fr 1fr; }
    .form-row .field-group { margin-bottom: 0; }

    /* BUTTONS */
    button {
      display: inline-flex; align-items: center; gap: 6px;
      height: 38px; padding: 0 16px;
      border: none; border-radius: var(--radius-sm);
      font-size: 13.5px; font-family: inherit; font-weight: 500;
      cursor: pointer;
      transition: opacity 0.12s, transform 0.1s;
      white-space: nowrap; outline: none;
    }
    button:active { transform: scale(0.97); }
    .btn-primary { background: var(--blue); color: #fff; }
    .btn-primary:hover { background: var(--blue-dark); }
    .btn-ghost { background: var(--surface3); color: var(--label2); border: 1px solid var(--border-heavy); }
    .btn-ghost:hover { background: #e8e8ed; }
    .btn-danger { background: var(--red-soft); color: var(--red); border: 1px solid rgba(255,59,48,0.2); }
    .btn-sm { height: 30px; padding: 0 12px; font-size: 12.5px; border-radius: 6px; }
    .btn-full { width: 100%; justify-content: center; height: 44px; font-size: 15px; }

    /* SECTION DIVIDER */
    .sec-div {
      font-size: 11.5px; font-weight: 700;
      color: var(--label3); text-transform: uppercase; letter-spacing: 0.6px;
      padding: 18px 0 10px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 14px;
    }

    /* CHECKBOX LIST */
    .chk-list { background: var(--surface2); border-radius: var(--radius-md); padding: 4px 14px; }
    .chk-item {
      display: flex; align-items: flex-start; gap: 12px;
      padding: 10px 0;
      border-bottom: 1px solid var(--border);
    }
    .chk-item:last-child { border-bottom: none; }
    .chk-item input[type="checkbox"] {
      width: 20px; height: 20px; margin: 0; padding: 0; flex-shrink: 0; margin-top: 1px;
      -webkit-appearance: auto; appearance: auto;
    }
    .chk-item label { font-size: 13.5px; color: var(--label2); line-height: 1.4; cursor: pointer; }

    /* NATURE CHIPS */
    .nature-chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 6px; }
    .n-chip {
      display: flex; align-items: center; gap: 6px;
      padding: 7px 12px;
      border: 1px solid var(--border-heavy);
      border-radius: 999px;
      font-size: 13px; cursor: pointer;
      background: var(--surface); color: var(--label2);
      transition: background 0.12s, border-color 0.12s, color 0.12s;
      user-select: none;
    }
    .n-chip input[type="checkbox"] {
      width: 15px; height: 15px; margin: 0; padding: 0;
      -webkit-appearance: auto; appearance: auto;
    }
    .n-chip.on { background: var(--blue-soft); border-color: var(--blue); color: var(--blue); }

    /* ATTENDEE BLOCK */
    .att-block {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 14px; margin-bottom: 10px;
    }
    .att-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
    .att-name { font-size: 14px; font-weight: 600; color: var(--label); }

    /* BRIEFING BOX */
    .briefing-box {
      background: var(--surface2);
      border-radius: var(--radius-md);
      padding: 14px 16px;
      font-size: 13px; color: var(--label2); line-height: 2;
    }
    .briefing-box div::before { content: "— "; }

    /* FILTER BAR */
    .filter-bar {
      display: flex; flex-wrap: wrap; gap: 10px; align-items: flex-end;
      padding: 14px 16px;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      margin-bottom: 16px;
    }
    .filter-bar select,
    .filter-bar input[type="text"],
    .filter-bar input[type="date"] {
      width: auto; height: 34px; padding: 0 10px; font-size: 13px;
    }

    /* DOC LIST */
    .doc-list { display: flex; flex-direction: column; gap: 10px; }
    .doc-item {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 14px 16px;
      display: flex; align-items: center; justify-content: space-between;
      gap: 12px;
      transition: background 0.12s;
    }
    .doc-item:hover { background: var(--surface2); }
    .doc-item-info { flex: 1; min-width: 0; }
    .doc-item-title { font-size: 14px; font-weight: 600; color: var(--label); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .doc-item-meta { font-size: 12px; color: var(--label3); margin-top: 4px; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
    .doc-item-actions { display: flex; gap: 6px; flex-shrink: 0; }

    /* PILLS */
    .pill {
      display: inline-flex; align-items: center; gap: 4px;
      font-size: 11px; font-weight: 600;
      padding: 3px 8px; border-radius: 999px;
    }
    .pill-ind { background: var(--blue-soft); color: var(--blue); }
    .pill-hwp { background: var(--amber-soft); color: #92400e; }
    .pill-tbt { background: var(--green-soft); color: #1a7f3c; }
    .pill-open { background: var(--amber-soft); color: #92400e; }
    .pill-closed { background: var(--surface3); color: var(--label3); }

    /* MODAL */
    .modal {
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.48);
      backdrop-filter: blur(4px);
      display: none; justify-content: center; align-items: center;
      z-index: 9000; padding: 20px;
    }
    .modal.open { display: flex; }
    .modal-box {
      width: min(580px, 100%);
      max-height: 90vh; overflow-y: auto;
      background: var(--surface);
      border-radius: var(--radius-xl);
      box-shadow: var(--shadow-xl);
    }
    .modal-box.wide { width: min(840px, 100%); }
    .modal-hdr {
      display: flex; align-items: flex-start; justify-content: space-between;
      padding: 18px 20px; border-bottom: 1px solid var(--border);
      position: sticky; top: 0; background: var(--surface); z-index: 2;
      border-radius: var(--radius-xl) var(--radius-xl) 0 0;
      gap: 12px;
    }
    .modal-title { font-size: 16px; font-weight: 600; }
    .modal-sub { font-size: 12px; color: var(--label3); margin-top: 3px; }
    .modal-body { padding: 20px; }
    .modal-footer {
      display: flex; gap: 8px; justify-content: flex-end;
      padding: 14px 20px; border-top: 1px solid var(--border);
    }

    /* SIGNATURE CANVAS */
    .sig-wrap {
      border: 2px dashed var(--border-heavy);
      border-radius: var(--radius-md);
      overflow: hidden; background: #fff;
      position: relative; cursor: crosshair;
    }
    .sig-wrap canvas { display: block; width: 100%; touch-action: none; }
    .sig-placeholder {
      position: absolute; top: 50%; left: 50%;
      transform: translate(-50%,-50%);
      font-size: 13px; color: var(--label4);
      pointer-events: none;
    }
    .sig-toolbar { display: flex; justify-content: space-between; align-items: center; padding: 6px 0 0; }

    /* EMPTY STATE */
    .empty { padding: 40px 20px; text-align: center; color: var(--label3); }
    .empty-ico { font-size: 32px; margin-bottom: 8px; opacity: 0.4; }

    /* DECLARATION BOX */
    .dec-box {
      background: rgba(0,74,153,0.05);
      border: 1px solid rgba(0,74,153,0.15);
      border-radius: var(--radius-md);
      padding: 12px 14px;
      font-size: 13px; color: var(--label2); line-height: 1.5;
      margin-bottom: 14px;
    }

    /* READONLY FIELD */
    .readonly-field {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 10px 12px;
      font-size: 14px; color: var(--label2);
    }

    /* RESPONSIVE */
    @media (max-width: 600px) {
      .form-row { grid-template-columns: 1fr; }
      .form-row.three { grid-template-columns: 1fr 1fr; }
      .page { padding: 14px 12px 0; }
      .modal { padding: 0; align-items: flex-end; }
      .modal-box { border-radius: var(--radius-xl) var(--radius-xl) 0 0; max-height: 92vh; }
      .modal-hdr { border-radius: var(--radius-xl) var(--radius-xl) 0 0; }
      .filter-bar { flex-direction: column; }
      .filter-bar select,
      .filter-bar input { width: 100% !important; }
      .doc-item { flex-direction: column; align-items: flex-start; }
      .doc-item-actions { width: 100%; }
      .doc-item-actions button { flex: 1; justify-content: center; }
    }

    .links-panel { background: #f6f8fb; border: 1px solid var(--border); border-radius: 12px; padding: 12px 14px; margin: 6px 0 12px; }
    .links-title { font-size: 13px; font-weight: 700; color: var(--text, #1d1d1f); margin-bottom: 8px; }
    .link-chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
    .link-chip { display: inline-flex; align-items: center; gap: 6px; background: #fff; border: 1px solid var(--border); border-radius: 20px; padding: 4px 10px; font-size: 13px; }
    .link-chip-tag { font-size: 9px; color: #15803d; background: rgba(22,163,74,0.12); padding: 1px 6px; border-radius: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.3px; }
    .link-chip-x { cursor: pointer; color: #dc2626; font-weight: 800; padding: 0 2px; }
    .link-add { display: flex; gap: 8px; }
    .link-add input { flex: 1; padding: 9px 12px; border: 1px solid var(--border); border-radius: 10px; font-size: 14px; }
  </style>
</head>
<body>

<!-- TOPBAR -->
<div class="topbar">
  <div class="topbar-brand">
    <div class="topbar-logo">
      <img src="Mostlane Logo.jpg" alt="Mostlane" onerror="this.style.display='none'">
    </div>
    <div>
      <div class="topbar-title">SiteLog</div>
      <div class="topbar-subtitle">Documents</div>
    </div>
  </div>
  <button class="btn-ghost btn-sm" onclick="location.href='admin.html'">&#8592; Admin</button>
</div>

<!-- TAB BAR -->
<div class="tab-bar">
  <button class="tab-btn active" id="tab-issue" onclick="switchTab('issue')">&#128203; Issue Document</button>
  <button class="tab-btn" id="tab-records" onclick="switchTab('records')">&#128193; Records</button>
</div>

<!-- PAGE -->
<div class="page">

  <!-- ISSUE PANEL -->
  <div id="panel-issue">
    <div class="card">
      <div class="card-header">
        <div class="card-title">Issue New Document</div>
        <div class="card-subtitle">Select site and document type to begin</div>
      </div>
      <div class="card-body">
        <div class="form-row">
          <div class="field-group">
            <label class="field-label">Site</label>
            <select id="issueSite" onchange="onSiteChange()">
              <option value="">Select site...</option>
            </select>
          </div>
          <div class="field-group">
            <label class="field-label">Document Type</label>
            <select id="issueType" onchange="onTypeChange()">
              <option value="">Select type...</option>
              <option value="induction">&#128203; Site Induction</option>
              <option value="hwp">&#128293; Hot Works Permit</option>
              <option value="tbt">&#128172; Toolbox Talk</option>
            </select>
          </div>
        </div>
      </div>
    </div>
    <div id="formContainer"></div>
  </div>

  <!-- RECORDS PANEL -->
  <div id="panel-records" style="display:none;">
    <div class="filter-bar">
      <div>
        <label class="field-label">Type</label>
        <select id="recType" onchange="loadRecords()" style="width:150px;">
          <option value="">All Types</option>
          <option value="induction">Site Induction</option>
          <option value="hwp">Hot Works Permit</option>
          <option value="tbt">Toolbox Talk</option>
        </select>
      </div>
      <div>
        <label class="field-label">HWP Status</label>
        <select id="recStatus" onchange="loadRecords()" style="width:130px;">
          <option value="">All</option>
          <option value="issued">Current / Open</option>
          <option value="closed">Closed Out</option>
        </select>
      </div>
      <div>
        <label class="field-label">Site</label>
        <select id="recSite" onchange="loadRecords()" style="width:150px;">
          <option value="">All Sites</option>
        </select>
      </div>
      <div>
        <label class="field-label">Person</label>
        <input type="text" id="recPerson" placeholder="Search name..." oninput="loadRecords()" style="width:140px;">
      </div>
      <div>
        <label class="field-label">From</label>
        <input type="date" id="recFrom" onchange="loadRecords()">
      </div>
      <div>
        <label class="field-label">To</label>
        <input type="date" id="recTo" onchange="loadRecords()">
      </div>
      <button class="btn-ghost btn-sm" onclick="clearFilters()">Reset</button>
    </div>
    <div id="recordsList">
      <div class="empty"><div class="empty-ico">&#128193;</div><p>Loading...</p></div>
    </div>
  </div>

</div><!-- /page -->

<!-- SIGNATURE MODAL -->
<div class="modal" id="sigModal">
  <div class="modal-box">
    <div class="modal-hdr">
      <div>
        <div class="modal-title" id="sigTitle">Signature Required</div>
        <div class="modal-sub" id="sigSub"></div>
      </div>
      <span id="sigProgress" style="font-size:12px;color:var(--label3);flex-shrink:0;"></span>
    </div>
    <div class="modal-body">
      <div class="dec-box" id="sigDec"></div>
      <div class="sig-wrap">
        <canvas id="sigCanvas" width="540" height="180"></canvas>
        <div class="sig-placeholder" id="sigPlaceholder">Sign here with your finger</div>
      </div>
      <div class="sig-toolbar">
        <button class="btn-ghost btn-sm" onclick="clearMainCanvas()">&#10005; Clear</button>
        <span style="font-size:12px;color:var(--label3);">Pass device to signer</span>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn-ghost" onclick="skipSig()">Skip</button>
      <button class="btn-primary" onclick="confirmSig()">Confirm &#8594;</button>
    </div>
  </div>
</div>

<!-- VIEW DOCUMENT MODAL -->
<div class="modal" id="viewModal">
  <div class="modal-box wide">
    <div class="modal-hdr">
      <div>
        <div class="modal-title" id="viewTitle">Document</div>
        <div class="modal-sub" id="viewSub"></div>
      </div>
      <button class="btn-ghost btn-sm" onclick="closeView()">&#10005;</button>
    </div>
    <div id="viewLinks" style="padding:0 18px;"></div>
    <div class="modal-body" id="viewBody"></div>
    <div class="modal-footer">
      <button class="btn-ghost" onclick="closeView()">Close</button>
      <button class="btn-primary" onclick="exportPdf()">&#8593; Export PDF</button>
    </div>
  </div>
</div>

<!-- HWP CLOSEOUT MODAL -->
<div class="modal" id="closeoutModal">
  <div class="modal-box">
    <div class="modal-hdr">
      <div class="modal-title">&#128293; HWP Close Out</div>
    </div>
    <div class="modal-body">
      <div class="field-group">
        <label class="field-label">Completion Time</label>
        <input type="time" id="coTime">
      </div>
      <div class="field-group">
        <label class="field-label">Final Area Check</label>
        <div style="display:flex;flex-direction:column;gap:10px;margin-top:8px;">
          <label style="display:flex;align-items:center;gap:10px;font-size:14px;cursor:pointer;padding:10px;border:1px solid var(--border);border-radius:var(--radius-sm);">
            <input type="radio" name="areaSafe" value="1" style="width:18px;height:18px;"> <span style="color:#1a7f3c;font-weight:600;">&#9989; Area declared SAFE</span>
          </label>
          <label style="display:flex;align-items:center;gap:10px;font-size:14px;cursor:pointer;padding:10px;border:1px solid var(--border);border-radius:var(--radius-sm);">
            <input type="radio" name="areaSafe" value="0" style="width:18px;height:18px;"> <span style="color:var(--red);font-weight:600;">&#9888;&#65039; Area declared NOT SAFE</span>
          </label>
        </div>
      </div>
      <div class="field-group">
        <label class="field-label">Manager Signature</label>
        <div class="sig-wrap">
          <canvas id="coCanvas" width="540" height="140"></canvas>
          <div class="sig-placeholder" id="coPlaceholder">Sign here</div>
        </div>
        <div class="sig-toolbar">
          <button class="btn-ghost btn-sm" onclick="clearCoCanvas()">&#10005; Clear</button>
        </div>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn-ghost" onclick="closeCloseout()">Cancel</button>
      <button class="btn-primary" onclick="submitCloseout()">Submit Close Out</button>
    </div>
  </div>
</div>

<script>
const API = "https://api.site-log.co.uk";
(function(){ var of = window.fetch.bind(window); window.fetch = function(input, init){ var u = typeof input === "string" ? input : (input && input.url) || ""; if (u.indexOf(API) === 0) { init = Object.assign({}, init); init.credentials = "include"; } return of(input, init); }; })();

// STATE
let sitesData = [];
let onSitePeople = [];
let attendees = [];
let sigQueue = [];
let sigIndex = 0;
let capturedSigs = {};
let currentDocType = "";
let currentSiteName = "";
let currentSiteAddr = "";
let closeoutDocId = null;
let viewDocData = null;
let logoDataUrl = null;

// INIT
window.addEventListener("DOMContentLoaded", async () => {
  await preloadLogo();
  await loadSites();
  initSigCanvas(document.getElementById("sigCanvas"), "sigPlaceholder");
  initSigCanvas(document.getElementById("coCanvas"), "coPlaceholder");
});

async function preloadLogo() {
  try {
    const res = await fetch("Mostlane Logo.jpg");
    const blob = await res.blob();
    logoDataUrl = await new Promise(resolve => {
      const reader = new FileReader();
      reader.onload = () => resolve(reader.result);
      reader.readAsDataURL(blob);
    });
  } catch (e) {
    logoDataUrl = null;
  }
}

async function loadSites() {
  try {
    const res = await fetch(API + "/sites");
    const data = await res.json();
    sitesData = (data.sites || []).filter(s => !Number(s.archived));

    const sel = document.getElementById("issueSite");
    sel.innerHTML =
      '<option value="">Select site...</option>' +
      sitesData.map(s => '<option value="' + escAttr(s.site_name) + '">' + escHtml(s.site_name) + '</option>').join("");

    const rsel = document.getElementById("recSite");
    rsel.innerHTML =
      '<option value="">All Sites</option>' +
      sitesData.map(s => '<option value="' + escAttr(s.site_name) + '">' + escHtml(s.site_name) + '</option>').join("");
  } catch (e) {
    console.error(e);
  }
}

// TABS
function switchTab(tab) {
  ["issue", "records"].forEach(t => {
    document.getElementById("panel-" + t).style.display = t === tab ? "" : "none";
    document.getElementById("tab-" + t).classList.toggle("active", t === tab);
  });
  if (tab === "records") loadRecords();
}

// SITE / TYPE CHANGE
async function onSiteChange() {
  currentSiteName = document.getElementById("issueSite").value;
  const siteObj = sitesData.find(s => s.site_name === currentSiteName);
  currentSiteAddr = siteObj ? (siteObj.address || "") : "";
  attendees = [];
  capturedSigs = {};

  if (currentSiteName) {
    try {
      // Everyone signed into this site now OR previously, so document name
      // fields suggest the right people (currently-on-site listed first).
      const res = await fetch(API + "/site-people?site=" + enc(currentSiteName));
      const data = await res.json();
      onSitePeople = data.people || [];
    } catch (e) {
      onSitePeople = [];
    }
  } else {
    onSitePeople = [];
  }

  onTypeChange();
}

function onTypeChange() {
  currentDocType = document.getElementById("issueType").value;
  attendees = [];
  capturedSigs = {};
  if (!currentSiteName || !currentDocType) {
    document.getElementById("formContainer").innerHTML = "";
    return;
  }
  renderForm();
}

  else if (currentDocType === "tbt") renderTBT(c);
}

}

function nowTime() {

}

// PERMIT NO
function genPermitNo() {
  const s = currentSiteName.replace(/[^A-Z0-9]/gi, "").toUpperCase().slice(0, 6);
  const d = today().replace(/-/g, "");
  const n = String(Math.floor(Math.random() * 900) + 100);
  return "HWP-" + s + "-" + d + "-" + n;
}

// FIELD MEMORY
async function fetchMem(key, dlId) {
  try {
    const res = await fetch(API + "/field-memory/suggest?key=" + key + "&site=" + enc(currentSiteName));
    const data = await res.json();
    const dl = document.getElementById(dlId);
    if (dl && data.suggestions) {
      dl.innerHTML = data.suggestions.map(s => '<option value="' + escAttr(s.value) + '">').join("");
    }
  } catch (e) {}
}

async function saveMem(key, value) {
  if (!value || !String(value).trim()) return;
  try {
    await fetch(API + "/field-memory/save", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ key, value: String(value).trim(), site: currentSiteName })
    });
  } catch (e) {}
}

// SIGNING FLOW
function collectAttendees() {
  for (let i = 0; i < attendees.length; i++) {
    attendees[i].personName = (document.getElementById("an_" + i) ? document.getElementById("an_" + i).value : "").trim();
    attendees[i].company = (document.getElementById("ac_" + i) ? document.getElementById("ac_" + i).value : "").trim();
    if (currentDocType === "induction") {
      attendees[i].trade = (document.getElementById("at_" + i) ? document.getElementById("at_" + i).value : "").trim();
      attendees[i].contact = (document.getElementById("atel_" + i) ? document.getElementById("atel_" + i).value : "").trim();
      attendees[i].cscs = (document.getElementById("acscs_" + i) ? document.getElementById("acscs_" + i).value : "").trim();
    }
  }
}

function startSigning() {
  collectAttendees();

  const valid = attendees.filter(a => a.personName);
  if (!valid.length) {
    alert("Please add at least one person.");
    return;
  }

  if (currentDocType === "induction" && !val("i_giver")) {
    alert("Please enter the induction giver name.");
    return;
  }
  if (currentDocType === "hwp" && !val("h_loc")) {
    alert("Please enter the location of hot works.");
    return;
  }
  if (currentDocType === "tbt" && !val("t_title")) {
    alert("Please enter the talk title.");
    return;
  }

  const decs = {
    induction: "I confirm I have received a site-specific induction and fully understand the safety rules and procedures outlined above. I agree to work in accordance with the site RAMS, follow safe systems of work, wear appropriate PPE, and report unsafe acts or conditions immediately.",
    hwp: "I confirm I have read and understood this Hot Works Permit and will comply with all safety precautions listed. I accept responsibility for carrying out works safely in accordance with CDM Regulations and approved RAMS.",
    tbt: "I confirm I attended this toolbox talk, understood the content, and will apply it to my work on site."
  };
  const mgrLabels = {
    induction: "Induction Given By",
    hwp: "Permit Issued By (Manager)",
    tbt: "Delivered By (Manager)"
  };

  sigQueue = [];
  capturedSigs = {};

  valid.forEach((att, i) => {
    sigQueue.push({
      type: "attendee",
      idx: i,
      name: att.personName,
      company: att.company,
      declaration: decs[currentDocType]
    });
  });

  sigQueue.push({
    type: "manager",
    idx: -1,
    name: mgrLabels[currentDocType],
    company: "",
    declaration: "I confirm this document is accurate and all precautions are in place."
  });

  sigIndex = 0;
  showSig();
}

function showSig() {
  if (sigIndex >= sigQueue.length) {
    submitDocument();
    return;
  }
  const s = sigQueue[sigIndex];
  document.getElementById("sigTitle").textContent = s.type === "manager" ? s.name + " — Sign Below" : s.name + " — Please Sign";
  document.getElementById("sigSub").textContent = s.company ? s.company : "";
  document.getElementById("sigDec").textContent = s.declaration;
  document.getElementById("sigProgress").textContent = (sigIndex + 1) + " / " + sigQueue.length;
  clearMainCanvas();
  document.getElementById("sigModal").classList.add("open");
}

function confirmSig() {
  const canvas = document.getElementById("sigCanvas");
  const ctx = canvas.getContext("2d");
  const pixels = ctx.getImageData(0, 0, canvas.width, canvas.height).data;
  const hasSig = pixels.some((v, i) => i % 4 === 3 && v > 10);
  if (!hasSig) {
    alert("Please sign before continuing.");
    return;
  }
  capturedSigs[sigIndex] = canvas.toDataURL("image/png");
  document.getElementById("sigModal").classList.remove("open");
  sigIndex++;
  setTimeout(showSig, 180);
}

function skipSig() {
  document.getElementById("sigModal").classList.remove("open");
  sigIndex++;
  setTimeout(showSig, 180);
}

function clearMainCanvas() {
  const c = document.getElementById("sigCanvas");
  c.getContext("2d").clearRect(0, 0, c.width, c.height);
  document.getElementById("sigPlaceholder").style.display = "";
}

// CANVAS DRAWING
function initSigCanvas(canvas, placeholderId) {
  const ctx = canvas.getContext("2d");
  ctx.strokeStyle = "#1d1d1f";
  ctx.lineWidth = 2.5;
  ctx.lineCap = "round";
  ctx.lineJoin = "round";
  let drawing = false;

  const pos = e => {
    const r = canvas.getBoundingClientRect();
    const t = e.touches ? e.touches[0] : e;
    return {
      x: (t.clientX - r.left) * (canvas.width / r.width),
      y: (t.clientY - r.top) * (canvas.height / r.height)
    };
  };

  const hide = () => {
    const pl = document.getElementById(placeholderId);
    if (pl) pl.style.display = "none";
  };

  canvas.addEventListener("mousedown", e => {
    drawing = true;
    const p = pos(e);
    ctx.beginPath();
    ctx.moveTo(p.x, p.y);
    hide();
  });

  canvas.addEventListener("mousemove", e => {
    if (!drawing) return;
    const p = pos(e);
    ctx.lineTo(p.x, p.y);
    ctx.stroke();
  });

  canvas.addEventListener("mouseup", () => drawing = false);
  canvas.addEventListener("mouseleave", () => drawing = false);

  canvas.addEventListener("touchstart", e => {
    e.preventDefault();
    drawing = true;
    const p = pos(e);
    ctx.beginPath();
    ctx.moveTo(p.x, p.y);
    hide();
  }, { passive: false });

  canvas.addEventListener("touchmove", e => {
    e.preventDefault();
    if (!drawing) return;
    const p = pos(e);
    ctx.lineTo(p.x, p.y);
    ctx.stroke();
  }, { passive: false });

  canvas.addEventListener("touchend", () => drawing = false);
}

// SUBMIT DOCUMENT
async function submitDocument() {
  document.getElementById("sigModal").classList.remove("open");

  const validAtts = attendees.filter(a => a.personName);
  const mgrSigIdx = sigQueue.findIndex(s => s.type === "manager");
  const mgrSig = mgrSigIdx >= 0 ? (capturedSigs[mgrSigIdx] || null) : null;

  const attData = validAtts.map((a, i) => ({
    personId: a.personId || null,
    personName: a.personName,
    company: a.company,
    trade: a.trade || null,
    contact: a.contact || null,
    cscs: a.cscs || null,
    signature: capturedSigs[i] || null
  }));

  let formData = {};

  if (currentDocType === "induction") {
    formData = {
      project: val("i_proj"),
      address: val("i_addr"),
      site_manager: val("i_mgr"),
      date: val("i_date"),
      giver_name: val("i_giver")
    };
    saveMem("i_proj", formData.project);
    saveMem("i_addr", formData.address);
    saveMem("i_mgr", formData.site_manager);
    saveMem("i_giver", formData.giver_name);
    validAtts.forEach(a => {
      saveMem("att_co", a.company);
      saveMem("att_tr", a.trade || "");
    });
  }

  if (currentDocType === "hwp") {
    const natureKeys = ["Welding","Cutting","Grinding","Solder_Braze","Bitumen","Blow_Torch","Other"];
    const natures = natureKeys
      .filter(n => document.getElementById("hn_" + n) && document.getElementById("hn_" + n).checked)
      .map(n => n.replace("_", "/"));

    formData = {
      project: val("h_proj"),
      client: val("h_client"),
      date: val("h_date"),
      issued_by: val("h_issby"),
      valid_from: val("h_from"),
      permit_no: val("h_pno"),
      location: val("h_loc"),
      nature: natures,
      equipment: val("h_equip"),
      precautions: [1,2,3,4,5,6,7,8,9].map(n => !!(document.getElementById("hc" + n) && document.getElementById("hc" + n).checked)),
      fire_watch: [1,2,3].map(n => !!(document.getElementById("fw" + n) && document.getElementById("fw" + n).checked)),
      fire_watch_name: val("h_fwname")
    };

    saveMem("h_proj", formData.project);
    saveMem("h_client", formData.client);
    saveMem("h_issby", formData.issued_by);
    saveMem("h_loc", formData.location);
    saveMem("h_equip", formData.equipment);
    saveMem("h_fwname", formData.fire_watch_name);
  }

  if (currentDocType === "tbt") {
    formData = {
      project: val("t_proj"),
      address: val("t_addr"),
      site_manager: val("t_mgr"),
      date: val("t_date"),
      title: val("t_title"),
      delivered_by: val("t_dlvby"),
      duration: val("t_dur"),
      summary: val("t_summary"),
      key_points: val("t_keypts"),
      hazards: val("t_hazards")
    };

    saveMem("t_proj", formData.project);
    saveMem("t_addr", formData.address);
    saveMem("t_mgr", formData.site_manager);
    saveMem("t_title", formData.title);
    saveMem("t_dlvby", formData.delivered_by);
    saveMem("t_hz", formData.hazards);
  }

  try {
    const res = await fetch(API + "/documents/create", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        type: currentDocType,
        site_name: currentSiteName,
        site_address: currentSiteAddr,
        form_data: formData,
        attendees: attData,
        permit_no: formData.permit_no || null,
        manager_signature: mgrSig,
        issued_at: new Date().toISOString().replace("T", " ").slice(0, 19)
      })
    });

    const data = await res.json();
    if (!res.ok || !data.ok) {
      alert(data.error || "Save failed.");
      return;
    }

    alert("Document saved successfully.");
    attendees = [];
    capturedSigs = {};
    document.getElementById("issueType").value = "";
    document.getElementById("formContainer").innerHTML = "";
  } catch (e) {
    alert("Network error — please try again.");
  }
}

// RECORDS
async function loadRecords() {
  const qs = new URLSearchParams();
  const type = document.getElementById("recType").value;
  const status = document.getElementById("recStatus").value;
  const site = document.getElementById("recSite").value;
  const person = document.getElementById("recPerson").value.trim();
  const from = document.getElementById("recFrom").value;
  const to = document.getElementById("recTo").value;

  if (type) qs.set("type", type);
  if (status) qs.set("status", status);
  if (site) qs.set("site", site);
  if (person) qs.set("person", person);
  if (from) qs.set("from", from);
  if (to) qs.set("to", to);

  const container = document.getElementById("recordsList");
  container.innerHTML = '<div class="empty"><div class="empty-ico">&#9203;</div><p>Loading...</p></div>';

  try {
    const res = await fetch(API + "/documents?" + qs.toString());
    const data = await res.json();
    const docs = data.documents || [];

    if (!docs.length) {
      container.innerHTML = '<div class="empty"><div class="empty-ico">&#128193;</div><p>No documents found.</p></div>';
      return;
    }

    container.innerHTML = '<div class="doc-list">' + docs.map(docItem).join("") + "</div>";
  } catch (e) {
    container.innerHTML = '<div class="empty"><div class="empty-ico">&#9888;&#65039;</div><p>Failed to load.</p></div>';
  }
}

function docItem(doc) {
  const tl = { induction: "&#128203; Site Induction", hwp: "&#128293; Hot Works Permit", tbt: "&#128172; Toolbox Talk" };
  const tp = { induction: "pill-ind", hwp: "pill-hwp", tbt: "pill-tbt" };
  const date = (doc.issued_at || "").slice(0, 10);
  const fname = docFileName(doc);

  let statusPill = "";
  if (doc.type === "hwp") {
    statusPill = doc.status === "closed"
      ? '<span class="pill pill-closed">Closed Out</span>'
      : '<span class="pill pill-open">Open</span>';
  }

  const safeId = String(doc.id || "").replace(/'/g, "\\'");
  const closeoutBtn = (doc.type === "hwp" && doc.status !== "closed")
    ? '<button class="btn-ghost btn-sm" onclick="openCloseout(\'' + safeId + '\')">Close Out</button>'
    : "";
  const numTag = doc.doc_number ? '<span class="pill" style="background:#0f172a;color:#fff;font-weight:700;">' + escHtml(doc.doc_number) + '</span>' : "";
  const safeNum = String(doc.doc_number || fname).replace(/'/g, "\\'");

  return '<div class="doc-item"><div class="doc-item-info"><div class="doc-item-title">' + escHtml(fname) + '</div><div class="doc-item-meta">' + numTag + '<span class="pill ' + (tp[doc.type] || "") + '">' + (tl[doc.type] || doc.type) + '</span>' + statusPill + '<span>' + escHtml(doc.site_name || "—") + '</span><span>' + escHtml(date) + '</span>' + (doc.attendee_names ? '<span style="color:var(--label2);">' + escHtml(doc.attendee_names) + '</span>' : '') + '</div></div><div class="doc-item-actions">' + closeoutBtn + '<button class="btn-primary btn-sm" onclick="viewDoc(\'' + safeId + '\')">View</button><button class="btn-danger btn-sm" onclick="deleteDoc(\'' + safeId + '\',\'' + safeNum + '\')">Delete</button></div></div>';
}

async function deleteDoc(id, label) {
  if (!confirm("Delete document " + (label || "") + "?\n\nThis permanently removes it and its signatures. This cannot be undone.")) return;
  try {
    const res = await fetch(API + "/documents/delete", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ id }) });
    const d = await res.json().catch(() => ({}));
    if (!res.ok || !d.ok) throw new Error(d.error || "Failed");
  } catch (e) {
    alert("Could not delete: " + (e.message || e));
    return;
  }
  loadRecords();
}

function docFileName(doc) {
  const tc = { induction: "Induction", hwp: "HWP", tbt: "TBT" }[doc.type] || String(doc.type || "").toUpperCase();
  const si = (doc.site_name || "Site").replace(/[^A-Za-z0-9]/g, "");
  const dt = (doc.issued_at || "").slice(0, 10);
  const nm = (doc.attendee_names || "").split(",")[0].trim().split(" ").pop() || "Unknown";
  return (doc.doc_number ? doc.doc_number + "_" : "") + tc + "_" + nm + "_" + si + "_" + dt;
}

function clearFilters() {
  ["recType","recStatus","recSite"].forEach(id => document.getElementById(id).value = "");
  document.getElementById("recPerson").value = "";
  document.getElementById("recFrom").value = "";
  document.getElementById("recTo").value = "";
  loadRecords();
}

// VIEW DOCUMENT
async function viewDoc(id) {
  try {
    const res = await fetch(API + "/documents/single?id=" + id);
    const data = await res.json();
    const doc = data.document;
    if (!doc) {
      alert("Document not found.");
      return;
    }
    viewDocData = doc;
    document.getElementById("viewTitle").textContent = docFileName(doc);
    document.getElementById("viewSub").textContent = (doc.doc_number ? doc.doc_number + " · " : "") + (doc.site_name || "") + " · " + (doc.issued_at || "").slice(0, 10);
    document.getElementById("viewBody").innerHTML = buildPreview(doc);
    document.getElementById("viewModal").classList.add("open");
    renderViewLinks(doc);
  } catch (e) {
    alert("Failed to load document.");
  }
}

// People this document is linked to (who'll see it in the app), plus an
// add-person control. Signed attendees are shown but can't be unlinked here;
// extra links can be added/removed after the fact.
async function renderViewLinks(doc) {
  const box = document.getElementById("viewLinks");
  if (!box) return;
  const signees = (doc.attendees || []).filter(a => a.person_id).map(a => ({ id: a.person_id, name: a.person_name, kind: "signee" }));
  const signeeIds = new Set(signees.map(s => s.id));
  const extras = (doc.linked || []).filter(l => l.person_id && !signeeIds.has(l.person_id)).map(l => ({ id: l.person_id, name: l.person_name, kind: "link" }));
  const all = signees.concat(extras);

  let people = [];
  try {
    const r = await fetch(API + "/site-people?site=" + enc(doc.site_name || ""));
    people = (await r.json()).people || [];
  } catch (e) {}
  const linkedIds = new Set(all.map(p => p.id));
  const opts = people.filter(p => p.person_id && !linkedIds.has(p.person_id))
    .map(p => '<option value="' + escAttr(p.name) + '" data-pid="' + escAttr(p.person_id) + '">').join("");

  const chips = all.length
    ? all.map(p => '<span class="link-chip">' + escHtml(p.name) +
        (p.kind === "signee" ? ' <span class="link-chip-tag">signed</span>'
          : ' <span class="link-chip-x" onclick="unlinkPerson(\'' + String(p.id).replace(/'/g, "\\'") + '\')">&times;</span>') + '</span>').join("")
    : '<span style="color:var(--label3);font-size:13px;">No one linked yet.</span>';

  box.innerHTML =
    '<div class="links-panel">' +
      '<div class="links-title">&#128279; Linked people <span style="font-weight:400;color:var(--label3);font-size:11px;">(see this in their app)</span></div>' +
      '<div class="link-chips">' + chips + '</div>' +
      '<div class="link-add"><input id="linkAddName" list="linkAddList" placeholder="Add a person on this site..."><datalist id="linkAddList">' + opts + '</datalist>' +
      '<button class="btn-ghost btn-sm" onclick="linkPersonFromInput()">Link</button></div>' +
    '</div>';
  box._people = people;
}

async function linkPersonFromInput() {
  const input = document.getElementById("linkAddName");
  const box = document.getElementById("viewLinks");
  if (!input || !viewDocData) return;
  const name = input.value.trim();
  const people = (box && box._people) || [];
  const match = people.find(p => p.name === name);
  if (!match || !match.person_id) { alert("Pick a person from the suggestions so they can be linked."); return; }
  try {
    const res = await fetch(API + "/documents/link", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ docId: viewDocData.id, personId: match.person_id, personName: match.name }) });
    const d = await res.json().catch(() => ({}));
    if (!res.ok || !d.ok) throw new Error(d.error || "Failed");
  } catch (e) { alert("Could not link: " + (e.message || e)); return; }
  viewDoc(viewDocData.id);
}

async function unlinkPerson(personId) {
  if (!viewDocData) return;
  try {
    const res = await fetch(API + "/documents/unlink", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ docId: viewDocData.id, personId }) });
    const d = await res.json().catch(() => ({}));
    if (!res.ok || !d.ok) throw new Error(d.error || "Failed");
  } catch (e) { alert("Could not unlink: " + (e.message || e)); return; }
  viewDoc(viewDocData.id);
}

function closeView() {
  document.getElementById("viewModal").classList.remove("open");
  viewDocData = null;
}

function buildPreview(doc) {
  const fd = doc.form_data || {};
  const at = doc.attendees || [];
  if (doc.type === "induction") return previewInduction(doc, fd, at);
  if (doc.type === "hwp") return previewHWP(doc, fd, at);
  if (doc.type === "tbt") return previewTBT(doc, fd, at);
  return "<p>Unknown document type.</p>";
}

// PDF FIXED LAYOUT SYSTEM
const PF = "font-family:Arial,Helvetica,sans-serif;";

function pdfDocHeader(title, sub) {

function pdfSecHead(text) {

}

function pdfGrid2(pairs) {
  const rows = [];
  for (let i = 0; i < pairs.length; i += 2) {
    const l1 = pairs[i][0], v1 = pairs[i][1];
    const l2 = pairs[i+1] ? pairs[i+1][0] : "";
    const v2 = pairs[i+1] ? pairs[i+1][1] : "";
    rows.push('<tr><td style="' + PF + 'padding:3px 7px;border:' + PBD + ';background:' + PLB + ';font-size:10px;font-weight:700;width:17%;white-space:nowrap;">' + escHtml(l1) + '</td><td style="' + PF + 'padding:3px 7px;border:' + PBD + ';font-size:11px;width:33%;">' + (escHtml(String(v1 || "")) || "&mdash;") + '</td><td style="' + PF + 'padding:3px 7px;border:' + PBD + ';background:' + PLB + ';font-size:10px;font-weight:700;width:17%;white-space:nowrap;">' + escHtml(l2) + '</td><td style="' + PF + 'padding:3px 7px;border:' + PBD + ';font-size:11px;width:33%;">' + (l2 ? (escHtml(String(v2 || "")) || "&mdash;") : "&nbsp;") + '</td></tr>');
  }
  return '<table width="100%" cellpadding="0" cellspacing="0" style="border-collapse:collapse;">' + rows.join("") + '</table>';
}

function pdfGrid1(pairs) {
  return '<table width="100%" cellpadding="0" cellspacing="0" style="border-collapse:collapse;">' + pairs.map(function(p){ return '<tr><td style="' + PF + 'padding:3px 7px;border:' + PBD + ';background:' + PLB + ';font-size:10px;font-weight:700;width:26%;white-space:nowrap;">' + escHtml(p[0]) + '</td><td style="' + PF + 'padding:3px 7px;border:' + PBD + ';font-size:11px;">' + (escHtml(String(p[1] || "")) || "—") + '</td></tr>'; }).join("") + '</table>';
}

function pdfSigRow(label, name, b64) {
  return '<table width="100%" cellpadding="0" cellspacing="0" style="border-collapse:collapse;"><tr><td style="' + PF + 'padding:3px 7px;border:' + PBD + ';background:' + PLB + ';font-size:10px;font-weight:700;width:26%;white-space:nowrap;">Print Name</td><td style="' + PF + 'padding:3px 7px;border:' + PBD + ';font-size:11px;">' + escHtml(name || "") + '&nbsp;</td></tr><tr><td style="' + PF + 'padding:3px 7px;border:' + PBD + ';background:' + PLB + ';font-size:10px;font-weight:700;">' + escHtml(label || "Signature") + '</td><td style="border:' + PBD + ';height:48px;background:#fff;padding:4px;">' + (b64 ? '<img src="' + b64 + '" style="max-height:40px;max-width:220px;display:block;">' : "&nbsp;") + '</td></tr></table>';
}

function pdfBullets2Col(items) {
  const half = Math.ceil(items.length / 2);
  const c1 = items.slice(0, half);
  const c2 = items.slice(half);
  const li = t => '<div style="' + PF + 'font-size:11px;padding:2px 0;line-height:1.35;">&#8226;&nbsp;' + escHtml(t) + '</div>';
  return '<table width="100%" cellpadding="0" cellspacing="0" style="border-collapse:collapse;border:' + PBD + ';background:#f6f8fb;"><tr><td style="padding:6px 9px;vertical-align:top;width:50%;border-right:' + PBD + ';">' + c1.map(li).join("") + '</td><td style="padding:6px 9px;vertical-align:top;width:50%;">' + c2.map(li).join("") + '</td></tr></table>';
}

function pdfCheckboxes2Col(labels, checked) {
  const half = Math.ceil(labels.length / 2);
  const c1 = labels.slice(0, half);
  const c2 = labels.slice(half);
  const cb = (l, i, offset) => {
    const on = !!(checked[i + (offset || 0)]);
    return '<div style="' + PF + 'font-size:11px;padding:2px 0;line-height:1.35;">' + (on ? "&#9745;" : "&#9744;") + '&nbsp;' + escHtml(l) + '</div>';
  };
  return '<table width="100%" cellpadding="0" cellspacing="0" style="border-collapse:collapse;border:' + PBD + ';background:#f6f8fb;"><tr><td style="padding:5px 8px;vertical-align:top;width:50%;border-right:' + PBD + ';">' + c1.map((l, i) => cb(l, i, 0)).join("") + '</td><td style="padding:5px 8px;vertical-align:top;width:50%;">' + c2.map((l, i) => cb(l, i, half)).join("") + '</td></tr></table>';
}

const pdfGap = '<div style="height:8px;"></div>';

// TBT PREVIEW
function previewTBT(doc, fd, atts) {
  const attendeeRows = atts.map((a, i) => {
    return '<table width="100%" cellpadding="0" cellspacing="0" style="border-collapse:collapse;margin-bottom:5px;"><tr><td style="' + PF + 'padding:3px 7px;border:' + PBD + ';background:#dde5f0;font-size:10px;font-weight:700;width:17%;">Attendee ' + (i+1) + '</td><td style="' + PF + 'padding:3px 7px;border:' + PBD + ';font-size:11px;width:33%;">' + escHtml(a.person_name || "") + '</td><td style="' + PF + 'padding:3px 7px;border:' + PBD + ';background:' + PLB + ';font-size:10px;font-weight:700;width:17%;">Company</td><td style="' + PF + 'padding:3px 7px;border:' + PBD + ';font-size:11px;width:33%;">' + escHtml(a.company || "") + '</td></tr><tr><td style="' + PF + 'padding:3px 7px;border:' + PBD + ';background:' + PLB + ';font-size:10px;font-weight:700;">Signature</td><td colspan="3" style="border:' + PBD + ';height:48px;background:#fff;padding:4px;">' + (a.signature ? '<img src="' + a.signature + '" style="max-height:40px;max-width:280px;display:block;">' : "&nbsp;") + '</td></tr></table>';
  }).join("");

  return '<div style="' + PF + 'font-size:11px;color:#1d1d1f;">' + pdfDocHeader("Toolbox Talk") + pdfSecHead("Session Details") + pdfGrid2([["Project", fd.project],["Site Address", fd.address || doc.site_address || ""],["Site Manager", fd.site_manager],["Date", fd.date],["Talk Title", fd.title],["Delivered By", fd.delivered_by],["Duration", fd.duration ? fd.duration + " mins" : ""],["",""]]) + pdfGap + pdfSecHead("Talk Content") + pdfGrid1([["Summary of Talk", fd.summary],["Key Points Raised", fd.key_points],["Site-Specific Hazards", fd.hazards]]) + pdfGap + pdfSecHead("Attendees") + attendeeRows + pdfGap + pdfSecHead("Delivered By — Manager Sign-Off") + pdfSigRow("Signature", fd.delivered_by, doc.manager_signature) + '</div>';
}

// ===== Clean A4 PDF generation (jsPDF) =====
// Builds a real, self-contained A4 PDF from the document data and downloads it —
// no print dialog, no PWA shell, no browser header/footer. (html2canvas-based
// export rendered blank on iOS Safari.)
const INDUCTION_BRIEFING = [
  "Site rules and expected conduct",
  "PPE requirements (hi-vis, boots, gloves, etc.)",
  "Welfare arrangements (toilets, mess area)",
  "Emergency procedures and muster point",
  "Location of fire extinguishers and first aid kit",
  "Site hazards (asbestos, live services, etc.)",
  "Requirement to follow RAMS and safe systems of work",
  "Permit-to-work systems (hot works, roof access, confined space)",
  "Working at height procedures",
  "Housekeeping and material storage",
  "Accident / near miss reporting procedure"
];
const HWP_PREC = ["Area inspected and deemed safe","Combustibles removed (10m where possible)","Combustibles protected with fire blankets","Openings / voids sealed or protected","Minimum 2 fire extinguishers present","Fire alarm isolation agreed (if required)","Fire watch appointed during works","Gas cylinders secured & flashback arrestors fitted","Adequate ventilation confirmed"];
const HWP_FW = ["Continuous fire watch during works","Fire watch to remain minimum 60 minutes after completion","Area re-inspected after 1 hour"];

const _imgSizeCache = {};
function measureImage(dataUrl) {
  if (!dataUrl) return Promise.resolve(null);
  if (_imgSizeCache[dataUrl]) return Promise.resolve(_imgSizeCache[dataUrl]);
  return new Promise(resolve => {
    const im = new Image();
    im.onload = () => { const s = { w: im.naturalWidth || 1, h: im.naturalHeight || 1 }; _imgSizeCache[dataUrl] = s; resolve(s); };
    im.onerror = () => resolve(null);
    im.src = dataUrl;
  });
}

async function exportPdf() {
  if (!viewDocData) return;
  if (!(window.jspdf && window.jspdf.jsPDF)) { alert("PDF engine not loaded — please reload the page and try again."); return; }
  try {
    const pdf = await generateDocPdf(viewDocData);
    pdf.save(docFileName(viewDocData) + ".pdf");
  } catch (e) {
    alert("Could not generate the PDF: " + (e && e.message ? e.message : e));
  }
}

async function generateDocPdf(doc) {
  const { jsPDF } = window.jspdf;
  const pdf = new jsPDF({ unit: "mm", format: "a4", compress: true });
  const PW = 210, M = 12, CW = PW - 2 * M, PAD = 1.6, MINROW = 6.4, PH = 297;
  const BLUE = [0, 74, 153], LB = [234, 239, 247], BD = [184, 196, 212], TX = [29, 29, 31], CH = [221, 229, 240], GBX = [246, 248, 251];
  const mm = pt => pt * 0.3528;
  let y = M;
  const fd = doc.form_data || {};
  const atts = doc.attendees || [];

  // Pre-measure every embedded image so signatures keep their aspect ratio.
  const logoSize = await measureImage(logoDataUrl);
  const sigSizes = {};
  for (const a of atts) { if (a.signature) sigSizes[a.signature] = await measureImage(a.signature); }
  if (doc.manager_signature) sigSizes[doc.manager_signature] = await measureImage(doc.manager_signature);

  function setText(size, bold, color) { pdf.setFont("helvetica", bold ? "bold" : "normal"); pdf.setFontSize(size); pdf.setTextColor(color ? color[0] : TX[0], color ? color[1] : TX[1], color ? color[2] : TX[2]); }
  function wrap(text, w, size, bold) { setText(size, bold); return pdf.splitTextToSize(String(text == null || text === "" ? "—" : text), Math.max(2, w - 2 * PAD)); }
  function linesH(lines, size) { return lines.length * mm(size) * 1.2 + 2 * PAD; }
  function need(h) { if (y + h > PH - M) { pdf.addPage(); y = M; } }
  function gap(h) { y += (h == null ? 2.5 : h); }
  function imgFmt(url) { return /image\/jpe?g/i.test(url) ? "JPEG" : "PNG"; }

  function drawCell(x, w, h, o) {
    if (o.fill) { pdf.setFillColor(o.fill[0], o.fill[1], o.fill[2]); pdf.rect(x, y, w, h, "F"); }
    pdf.setDrawColor(BD[0], BD[1], BD[2]); pdf.setLineWidth(0.2); pdf.rect(x, y, w, h, "S");
    if (o.lines && o.lines.length) {
      setText(o.size, o.bold, o.color);
      const lh = mm(o.size) * 1.2;
      let ty = y + PAD + mm(o.size) * 0.92;
      o.lines.forEach(ln => { pdf.text(ln, x + PAD, ty); ty += lh; });
    }
  }
  function placeImage(url, x, yy, maxW, maxH) {
    const s = sigSizes[url] || _imgSizeCache[url];
    if (!s) return;
    const sc = Math.min(maxW / s.w, maxH / s.h);
    try { pdf.addImage(url, imgFmt(url), x, yy, s.w * sc, s.h * sc); } catch (e) {}
  }
  function header(title, sub) {
    const h = 13; need(h + 2);
    pdf.setFillColor(BLUE[0], BLUE[1], BLUE[2]); pdf.rect(M, y, CW, h, "F");
    let tx = M + 4;
    if (logoDataUrl && logoSize) {
      const lh = 7, lw = lh * (logoSize.w / logoSize.h);
      try { pdf.addImage(logoDataUrl, imgFmt(logoDataUrl), M + 4, y + (h - lh) / 2, lw, lh); tx = M + 4 + lw + 4; } catch (e) {}
    }
    setText(13, true, [255, 255, 255]); pdf.text(String(title), tx, y + (sub ? 5.6 : 7.6));
    if (sub) { setText(8.5, false, [223, 232, 243]); pdf.text(String(sub), tx, y + 10); }
    y += h;
  }
  function section(text) {
    need(8); y += 2.5;
    setText(8, true, BLUE); pdf.text(String(text).toUpperCase(), M, y + 3.8);
    pdf.setDrawColor(BLUE[0], BLUE[1], BLUE[2]); pdf.setLineWidth(0.5); pdf.line(M, y + 5.2, M + CW, y + 5.2);
    y += 6.4;
  }
  function grid2(pairs) {
    const Lw = CW * 0.17, Vw = CW * 0.33;
    for (let i = 0; i < pairs.length; i += 2) {
      const p1 = pairs[i], p2 = pairs[i + 1] || ["", ""];
      const v1 = wrap(p1[1], Vw, 8.5), v2 = wrap(p2[0] ? p2[1] : "", Vw, 8.5);
      const rh = Math.max(MINROW, linesH(v1, 8.5), linesH(v2, 8.5));
      need(rh);
      drawCell(M, Lw, rh, { fill: LB, lines: wrap(p1[0], Lw, 7.6, true), size: 7.6, bold: true });
      drawCell(M + Lw, Vw, rh, { lines: v1, size: 8.5 });
      drawCell(M + Lw + Vw, Lw, rh, { fill: p2[0] ? LB : [255, 255, 255], lines: p2[0] ? wrap(p2[0], Lw, 7.6, true) : [], size: 7.6, bold: true });
      drawCell(M + 2 * Lw + Vw, Vw, rh, { lines: p2[0] ? v2 : [], size: 8.5 });
      y += rh;
    }
  }
  function grid1(pairs) {
    const Lw = CW * 0.26, Vw = CW * 0.74;
    pairs.forEach(p => {
      const v = wrap(p[1], Vw, 8.5);
      const rh = Math.max(MINROW, linesH(v, 8.5));
      need(rh);
      drawCell(M, Lw, rh, { fill: LB, lines: wrap(p[0], Lw, 7.6, true), size: 7.6, bold: true });
      drawCell(M + Lw, Vw, rh, { lines: v, size: 8.5 });
      y += rh;
    });
  }
  function listBox(items, checks) {
    const colW = CW / 2, half = Math.ceil(items.length / 2);
    const build = (arr, off) => {
      let out = [];
      arr.forEach((t, idx) => {
        // jsPDF's built-in fonts are WinAnsi — Unicode checkbox glyphs don't
        // render, so use ASCII boxes (the • bullet is WinAnsi-safe).
        const mark = checks ? (checks[idx + off] ? "[X]  " : "[  ]  ") : "•  ";
        setText(8.5, false);
        out = out.concat(pdf.splitTextToSize(mark + String(t), colW - 2 * PAD - 1));
      });
      return out;
    };
    const l1 = build(items.slice(0, half), 0), l2 = build(items.slice(half), half);
    const lh = mm(8.5) * 1.32, h = Math.max(l1.length, l2.length) * lh + 2 * PAD;
    need(h);
    pdf.setFillColor(GBX[0], GBX[1], GBX[2]); pdf.rect(M, y, CW, h, "F");
    pdf.setDrawColor(BD[0], BD[1], BD[2]); pdf.setLineWidth(0.2); pdf.rect(M, y, CW, h, "S"); pdf.line(M + colW, y, M + colW, y + h);
    setText(8.5, false, TX);
    let ty = y + PAD + mm(8.5) * 0.92; l1.forEach(ln => { pdf.text(ln, M + PAD, ty); ty += lh; });
    ty = y + PAD + mm(8.5) * 0.92; l2.forEach(ln => { pdf.text(ln, M + colW + PAD, ty); ty += lh; });
    y += h;
  }
  function headerBar(text) {
    const lines = wrap(text, CW, 8, true), h = Math.max(6, linesH(lines, 8));
    need(h); drawCell(M, CW, h, { fill: CH, lines: lines, size: 8, bold: true }); y += h;
  }
  function sigRow(label, sig) {
    const Lw = CW * 0.26, Vw = CW * 0.74, rh = 18; need(rh);
    drawCell(M, Lw, rh, { fill: LB, lines: wrap(label, Lw, 7.6, true), size: 7.6, bold: true });
    drawCell(M + Lw, Vw, rh, {});
    if (sig) placeImage(sig, M + Lw + PAD, y + PAD, Vw - 2 * PAD, rh - 2 * PAD);
    y += rh;
  }
  function signatureBlock(printName, sig) {
    grid1([["Print Name", printName || ""]]);
    sigRow("Signature", sig);
  }
  function warnBox(text) {
    setText(9, false); const lines = pdf.splitTextToSize(text, CW - 2 * PAD);
    const lh = mm(9) * 1.25, h = lines.length * lh + 2 * PAD + 1; need(h);
    pdf.setFillColor(255, 251, 235); pdf.rect(M, y, CW, h, "F");
    pdf.setDrawColor(240, 208, 96); pdf.setLineWidth(0.3); pdf.rect(M, y, CW, h, "S");
    setText(9, false, [122, 88, 0]); let ty = y + PAD + mm(9) * 0.92; lines.forEach(ln => { pdf.text(ln, M + PAD, ty); ty += lh; });
    y += h;
  }
  function noteText(text) {
    setText(7.5, false, [120, 120, 120]); const lines = pdf.splitTextToSize(text, CW);
    const lh = mm(7.5) * 1.3, h = lines.length * lh + 3; need(h);
    pdf.setDrawColor(205, 205, 205); pdf.setLineWidth(0.2); pdf.line(M, y + 1, M + CW, y + 1);
    let ty = y + 3.6; lines.forEach(ln => { pdf.text(ln, M, ty); ty += lh; });
    y += h;
  }

  if (doc.type === "induction") {
    header("Contractor Site Induction Form", doc.doc_number ? "Document No: " + doc.doc_number : "");
    section("Site Details");
    grid2([["Project", fd.project], ["Site Address", fd.address || doc.site_address || ""], ["Site Manager", fd.site_manager], ["Start Date", fd.date]]);
    gap(); section("Site Induction Briefing Includes"); listBox(INDUCTION_BRIEFING);
    gap(); section("Contractor Details");
    const dt = (doc.issued_at || "").slice(0, 10);
    atts.forEach((a, i) => {
      headerBar("CONTRACTOR " + (i + 1) + ": " + String(a.person_name || "").toUpperCase());
      grid2([["Full Name", a.person_name], ["Company", a.company], ["Trade / Role", a.trade], ["Contact Number", a.contact_number], ["CSCS No.", a.cscs_number], ["Date", dt]]);
      sigRow("Contractor Signature", a.signature); gap(2);
    });
    gap(); section("Induction Given By"); signatureBlock(fd.giver_name, doc.manager_signature);
  } else if (doc.type === "hwp") {
    header("Hot Works Permit", (doc.doc_number ? doc.doc_number + "  ·  " : "") + "Permit No: " + (fd.permit_no || doc.permit_no || ""));
    section("Project Details");
    grid2([["Project", fd.project], ["Site", fd.site || doc.site_name], ["Client / PC", fd.client], ["Date", fd.date], ["Issued By", fd.issued_by], ["Valid From", fd.valid_from]]);
    gap(); section("1. Description of Hot Works");
    grid1([["Location", fd.location], ["Nature of Works", (fd.nature || []).join(", ")], ["Equipment", fd.equipment]]);
    gap(); section("2. Fire & Safety Precautions"); listBox(HWP_PREC, fd.precautions || []);
    gap(); section("3. Fire Watch Requirements"); listBox(HWP_FW, fd.fire_watch || []);
    grid1([["Fire Watch Name", fd.fire_watch_name || ""]]);
    gap(); section("4. Operatives");
    atts.forEach((a, i) => { grid2([["Operative " + (i + 1), a.person_name], ["Company", a.company]]); sigRow("Signature", a.signature); gap(1.5); });
    gap(); section("5. Permit Issued By"); signatureBlock(fd.issued_by, doc.manager_signature);
    if (doc.status === "closed") {
      gap(); section("Close Out");
      grid2([["Completion Time", doc.completion_time], ["Final Area", doc.final_area_safe === 1 ? "Area declared SAFE" : "Area declared NOT SAFE"]]);
      sigRow("Manager Signature", doc.manager_signature);
    } else { gap(); warnBox("Open Permit  —  Close out required after works complete."); }
    gap(); noteText("Permit valid for one shift only. Must be displayed at work location. Void if works stop for more than 2 hours. All works must comply with CDM Regulations and approved RAMS.");
  } else if (doc.type === "tbt") {
    header("Toolbox Talk", doc.doc_number ? "Document No: " + doc.doc_number : "");
    section("Session Details");
    grid2([["Project", fd.project], ["Site Address", fd.address || doc.site_address || ""], ["Site Manager", fd.site_manager], ["Date", fd.date], ["Talk Title", fd.title], ["Delivered By", fd.delivered_by], ["Duration", fd.duration ? fd.duration + " mins" : ""], ["", ""]]);
    gap(); section("Talk Content");
    grid1([["Summary of Talk", fd.summary], ["Key Points Raised", fd.key_points], ["Site-Specific Hazards", fd.hazards]]);
    gap(); section("Attendees");
    atts.forEach((a, i) => { grid2([["Attendee " + (i + 1), a.person_name], ["Company", a.company]]); sigRow("Signature", a.signature); gap(1.5); });
    gap(); section("Delivered By — Manager Sign-Off"); signatureBlock(fd.delivered_by, doc.manager_signature);
  } else {
    header("Document"); noteText("Unknown document type.");
  }

  return pdf;
}

// HWP CLOSEOUT
function openCloseout(docId) {
  closeoutDocId = docId;
  document.getElementById("coTime").value = nowTime();
  document.querySelectorAll('input[name="areaSafe"]').forEach(r => r.checked = false);
  clearCoCanvas();
  document.getElementById("closeoutModal").classList.add("open");
}

function closeCloseout() {
  document.getElementById("closeoutModal").classList.remove("open");
  closeoutDocId = null;
}

function clearCoCanvas() {
  const c = document.getElementById("coCanvas");
  c.getContext("2d").clearRect(0, 0, c.width, c.height);
  document.getElementById("coPlaceholder").style.display = "";
}

async function submitCloseout() {
  const time = document.getElementById("coTime").value;
  const safe = document.querySelector('input[name="areaSafe"]:checked');
  if (!time) {
    alert("Please enter completion time.");
    return;
  }
  if (!safe) {
    alert("Please select area status.");
    return;
  }

  const canvas = document.getElementById("coCanvas");
  const ctx = canvas.getContext("2d");
  const pix = ctx.getImageData(0, 0, canvas.width, canvas.height).data;
  const hasSig = pix.some((v, i) => i % 4 === 3 && v > 10);
  if (!hasSig) {
    alert("Please sign the close out.");
    return;
  }

  const sig = canvas.toDataURL("image/png");
  try {
    const res = await fetch(API + "/documents/closeout", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        docId: closeoutDocId,
        completionTime: time,
        finalAreaSafe: parseInt(safe.value, 10),
        managerSignature: sig,
        closedAt: new Date().toISOString().replace("T", " ").slice(0, 19)
      })
    });
    const data = await res.json();
    if (!res.ok || !data.ok) {
      alert(data.error || "Close out failed.");
      return;
    }
    alert("HWP closed out successfully.");
    closeCloseout();
    loadRecords();
  } catch (e) {
    alert("Network error.");
  }
}

// UTILITIES
function escHtml(s) {
  return String(s == null ? "" : s)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#39;");
}

function escAttr(s) {
  return escHtml(s);
}

function enc(s) {
  return encodeURIComponent(s || "");
}

function val(id) {
  const el = document.getElementById(id);
  return el ? (el.value || "").trim() : "";
}
