<!DOCTYPE html>

<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Site Log — Mostlane</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/x-icon" href="favicon.ico" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --blue:      #004a99;
      --blue-mid:  #0060c8;
      --blue-lite: #1a7fff;
      --white:     #ffffff;
      --off:       #f0f4f9;
      --text:      #0a1628;
      --muted:     #5a6a84;
    }

    html, body {
      height: 100%;
      overflow-x: hidden;
    }

    body {
      font-family: "DM Sans", sans-serif;
      background: var(--blue);
      color: var(--white);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ── ANIMATED BACKGROUND ── */
    .bg {
      position: fixed;
      inset: 0;
      z-index: 0;
      overflow: hidden;
      background: var(--blue);
    }

    .bg-grid {
      position: absolute;
      inset: -10%;
      background-image:
        linear-gradient(rgba(255,255,255,0.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.04) 1px, transparent 1px);
      background-size: 60px 60px;
      animation: gridDrift 30s linear infinite;
    }

    @keyframes gridDrift {
      from { transform: translateY(0); }
      to   { transform: translateY(60px); }
    }

    .bg-orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(80px);
      opacity: 0.35;
      animation: orbFloat 12s ease-in-out infinite;
    }

    .bg-orb-1 {
      width: 600px; height: 600px;
      background: var(--blue-lite);
      top: -200px; right: -150px;
      animation-delay: 0s;
    }

    .bg-orb-2 {
      width: 400px; height: 400px;
      background: #0088ff;
      bottom: -100px; left: -100px;
      animation-delay: -6s;
    }

    @keyframes orbFloat {
      0%, 100% { transform: translate(0, 0) scale(1); }
      50%       { transform: translate(20px, -30px) scale(1.05); }
    }

    /* ── CONTENT ── */
    .page {
      position: relative;
      z-index: 1;
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 24px 60px;
      text-align: center;
    }

    /* ── LOGO MARK ── */
    .logomark {
      width: 90px;
      height: 90px;
      border-radius: 22px;
      object-fit: cover;
      box-shadow:
        0 0 0 1px rgba(255,255,255,0.15),
        0 8px 32px rgba(0,0,0,0.3);
      animation: logoIn 0.7s cubic-bezier(0.34,1.56,0.64,1) both;
      margin-bottom: 28px;
    }

    @keyframes logoIn {
      from { opacity: 0; transform: scale(0.7) translateY(10px); }
      to   { opacity: 1; transform: scale(1) translateY(0); }
    }

    /* ── WORDMARK ── */
    .wordmark {
      font-family: "Syne", sans-serif;
      font-weight: 800;
      font-size: clamp(42px, 10vw, 72px);
      letter-spacing: -2px;
      line-height: 1;
      color: var(--white);
      animation: fadeUp 0.6s 0.15s ease both;
    }

    .wordmark span {
      color: rgba(255,255,255,0.35);
    }

    .tagline {
      font-size: clamp(14px, 3.5vw, 17px);
      font-weight: 400;
      color: rgba(255,255,255,0.55);
      margin-top: 10px;
      letter-spacing: 0.3px;
      animation: fadeUp 0.6s 0.25s ease both;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(16px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* ── DIVIDER ── */
    .divider {
      width: 40px;
      height: 2px;
      background: rgba(255,255,255,0.2);
      border-radius: 1px;
      margin: 32px auto;
      animation: fadeUp 0.6s 0.3s ease both;
    }

    /* ── CTA CARDS ── */
    .cards {
      display: flex;
      flex-direction: column;
      gap: 14px;
      width: 100%;
      max-width: 400px;
      animation: fadeUp 0.6s 0.4s ease both;
    }

    .card {
      position: relative;
      display: flex;
      align-items: center;
      gap: 18px;
      padding: 20px 22px;
      border-radius: 18px;
      text-decoration: none;
      text-align: left;
      transition: transform 0.18s ease, box-shadow 0.18s ease;
      overflow: hidden;
      cursor: pointer;
    }

    .card:active {
      transform: scale(0.97);
    }

    /* Worker / PWA card */
    .card-primary {
      background: var(--white);
      color: var(--text);
      box-shadow: 0 8px 32px rgba(0,0,0,0.25), 0 1px 0 rgba(255,255,255,0.1);
    }

    .card-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 14px 40px rgba(0,0,0,0.3);
    }

    /* Guest / scan card */
    .card-secondary {
      background: rgba(255,255,255,0.1);
      color: var(--white);
      border: 1px solid rgba(255,255,255,0.18);
      box-shadow: 0 4px 20px rgba(0,0,0,0.15);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }

    .card-secondary:hover {
      transform: translateY(-2px);
      background: rgba(255,255,255,0.15);
      box-shadow: 0 8px 28px rgba(0,0,0,0.2);
    }

    .card-icon {
      width: 48px;
      height: 48px;
      border-radius: 13px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      flex-shrink: 0;
    }

    .card-primary .card-icon {
      background: #eef4ff;
    }

    .card-secondary .card-icon {
      background: rgba(255,255,255,0.15);
    }

    .card-text-title {
      font-family: "Syne", sans-serif;
      font-size: 16px;
      font-weight: 700;
      letter-spacing: -0.2px;
      margin-bottom: 2px;
    }

    .card-primary .card-text-title { color: var(--text); }
    .card-secondary .card-text-title { color: var(--white); }

    .card-text-sub {
      font-size: 13px;
      font-weight: 400;
      line-height: 1.4;
    }

    .card-primary .card-text-sub  { color: var(--muted); }
    .card-secondary .card-text-sub { color: rgba(255,255,255,0.55); }

    .card-arrow {
      margin-left: auto;
      font-size: 18px;
      flex-shrink: 0;
      opacity: 0.4;
      transition: opacity 0.15s, transform 0.15s;
    }

    .card:hover .card-arrow {
      opacity: 0.8;
      transform: translateX(3px);
    }

    .card-primary .card-arrow  { color: var(--blue); }
    .card-secondary .card-arrow { color: var(--white); }

    /* ── FOOTER ── */
    .footer {
      position: relative;
      z-index: 1;
      padding: 0 24px 32px;
      text-align: center;
      font-size: 12px;
      color: rgba(255,255,255,0.25);
      animation: fadeUp 0.6s 0.55s ease both;
    }

    /* ── BADGE ── */
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(255,255,255,0.1);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 999px;
      padding: 5px 12px 5px 8px;
      font-size: 12px;
      font-weight: 500;
      color: rgba(255,255,255,0.7);
      margin-bottom: 24px;
      animation: fadeUp 0.6s 0.05s ease both;
    }

    .badge-dot {
      width: 7px;
      height: 7px;
      background: #4ade80;
      border-radius: 50%;
      box-shadow: 0 0 0 2px rgba(74,222,128,0.3);
      animation: pulse 2s ease infinite;
    }

    @keyframes pulse {
      0%, 100% { box-shadow: 0 0 0 2px rgba(74,222,128,0.3); }
      50%       { box-shadow: 0 0 0 5px rgba(74,222,128,0.0); }
    }

    @media (min-width: 480px) {
      .cards {
        flex-direction: column;
      }
    }
  </style>

</head>
