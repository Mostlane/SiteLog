<!DOCTYPE html>
<html>
<head>
  <title>SiteLog Scan</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyANo2Q7OehYzHTTgMTxRr5ISamf5IradcM"></script>

  <style>
    body {
      font-family: "Segoe UI", sans-serif;
      background: #e6e8eb url('Mostlane_Embossed.png') no-repeat center center fixed;
      background-size: 180%;
      margin: 0;
      padding: 40px 20px;
      text-align: center;
    }

    h1 {
      background: rgba(0, 74, 153, 0.7);
      color: white;
      padding: 12px;
      border-radius: 10px;
      max-width: 520px;
      margin: auto;
    }

    .logo {
      display: block;
      margin: 16px auto 10px;
      max-width: 220px;
      width: 100%;
    }

    #card {
      margin: 20px auto;
      max-width: 520px;
      background: rgba(255,255,255,0.95);
      padding: 15px;
      border-radius: 12px;
      box-shadow: 0 6px 18px rgba(0,0,0,0.15);
    }

    /* 🔒 MAP LOCKED */
    #map {
      height: 260px;
      border-radius: 10px;
      margin-top: 10px;
      touch-action: none;
      pointer-events: none;
    }

    /* ✅ iOS-centred, consistent inputs/selects/buttons */
    input, select, button {
      display: block;
      width: 100%;
      max-width: 480px;
      box-sizing: border-box;
      margin: 10px auto 0;
      padding: 12px 14px;
      border-radius: 10px;
      border: 1px solid #cbd5e1;
      text-align: center;
      background: #fff;
      font-size: 16px;
      line-height: 1.2;
      -webkit-appearance: none;
      appearance: none;
    }

    /* Keep select arrow visible on iOS */
    select {
      -webkit-appearance: menulist;
      appearance: menulist;
    }

    input::placeholder {
      text-align: center;
      color: #9aa3af;
    }

    select:invalid { color: #6b7280; }
    option { color: #0f172a; }

    button {
      background: #004a99;
      color: white;
      border: none;
      cursor: pointer;
      font-weight: bold;
      padding: 14px 14px;
    }

    .site-notice {
      margin: 12px auto 18px;
      padding: 14px 16px;
      max-width: 520px;
      border-radius: 14px;
      background: rgba(255,255,255,0.9);
      border: 2px solid rgba(0,59,130,0.25);
      color: #0f172a;
      font-size: 18px;
      text-align: center;
    }

    .site-notice strong {
      color: #003b82;
    }

    /* Make checkbox row look cleaner on mobile */
    #registerBox label{
      max-width: 480px;
      margin: 14px auto 0;
      text-align: left;
      display: flex;
      gap: 10px;
      align-items: flex-start;
      color:#0f172a;
      line-height: 1.25;
    }
    #registerBox label input[type="checkbox"]{
      width: 26px;
      height: 26px;
      margin: 0;
      padding: 0;
      border-radius: 6px;
      -webkit-appearance: auto;
      appearance: auto;
    }

    /* ==============================
       ✅ BIG SUCCESS OVERLAY
    ============================== */
    #successOverlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.72);
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity .25s ease;
      z-index: 9999;
    }
    #successOverlay.active {
      opacity: 1;
      pointer-events: auto;
    }
    .successCard {
      background: rgba(255,255,255,0.98);
      width: min(520px, calc(100% - 40px));
      border-radius: 26px;
      padding: 44px 22px;
      box-shadow: 0 18px 50px rgba(0,0,0,0.28);
      transform: scale(.90);
      transition: transform .25s ease;
    }
    #successOverlay.active .successCard {
      transform: scale(1);
    }
    .successIcon {
      font-size: 76px;
      line-height: 1;
      margin-bottom: 12px;
    }
    .successTitle {
      font-size: 30px;
      font-weight: 800;
      letter-spacing: .2px;
      margin: 0;
      color: #0f172a;
    }
    .successSub {
      margin-top: 10px;
      font-size: 16px;
      color: #334155;
    }
    .successSite {
      margin-top: 14px;
      display: inline-block;
      padding: 10px 14px;
      border-radius: 999px;
      background: rgba(0,59,130,0.08);
      border: 1px solid rgba(0,59,130,0.14);
      color: #003b82;
      font-weight: 700;
    }

    /* 🔒 Hide site label on overlay */
    #successSite {
      display: none !important;
    }

    /* 🔁 Subtle backup reset link */
    .not-you{
      margin: 8px auto 0;
      max-width: 520px;
      font-size: 12px;
      color: rgba(15,23,42,0.45);
      text-align: right;
    }
    .not-you a{
      color: rgba(0,74,153,0.6);
      font-weight: 600;
      text-decoration: underline;
    }
    .not-you a:active{ opacity: 0.7; }

    /* Confirm sign out modal */
    #confirmSignOutModal {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.55);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 10000;
    }
    .confirmCard {
      background: #fff;
      width: min(520px, calc(100% - 40px));
      border-radius: 20px;
      padding: 24px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.35);
      text-align: center;
    }
    .confirmTitle {
      margin-top: 0;
      color: #0f172a;
    }
    .confirmText {
      color: #334155;
      margin-bottom: 18px;
    }
    .secondaryBtn {
      background: #ccc;
      color: #333;
    }
  </style>
</head>

<body>

<h1 id="title">Checking Location…</h1>

<img src="/SiteLog/Mostlane%20Logo.jpg" alt="Mostlane" class="logo"/>

<div class="site-notice" id="noticeBox">
  <strong>⚠️ Site Notice:</strong> Report to site foreman
</div>

<div id="card">
  <div id="status">Requesting GPS…</div>
  <div id="map"></div>

  <div class="not-you" id="notYouRow" style="display:none;">
    Backup: <a href="#" onclick="resetDeviceAndRegister(); return false;">Reset device</a>
  </div>

  <div id="registerBox" style="display:none; text-align:center;">
    <h3>First Visit Registration</h3>

    <input id="firstName" placeholder="First Name">
    <input id="lastName" placeholder="Last Name">

    <select id="purpose" required>
      <option value="" disabled selected>Select from list</option>
      <option value="Visiting">Visiting</option>
      <option value="Contractor">Contractor</option>
    </select>

    <select id="company" required>
      <option value="" disabled selected>Select from list</option>
    </select>

    <label>
      <input type="checkbox" id="hsAck">
      <span>I have read site rules and will report to site foreman</span>
    </label>

    <button onclick="register()">Confirm & Check In</button>
  </div>
</div>

<div id="successOverlay" aria-hidden="true">
  <div class="successCard" role="dialog" aria-modal="true">
    <div id="successIcon" class="successIcon">✅</div>
    <h2 id="successTitle" class="successTitle">Checked In</h2>
    <div id="successSub" class="successSub">Recorded successfully</div>
    <div id="successSite" class="successSite" style="display:none;">Site</div>
  </div>
</div>

<div id="confirmSignOutModal">
  <div class="confirmCard">
    <h3 class="confirmTitle">Confirm Sign Out</h3>
    <p id="confirmSignOutText" class="confirmText"></p>

    <button onclick="confirmSignOutYes()">Yes, Sign Me Out</button>
    <button class="secondaryBtn" onclick="confirmSignOutNo()">No, Stay Signed In</button>
  </div>
</div>

<script>
const API = "https://sitelog-api.jamie-def.workers.dev";

let deviceToken = localStorage.getItem("mostlane_device_id");
if (!deviceToken) {
  deviceToken = crypto.randomUUID();
  localStorage.setItem("mostlane_device_id", deviceToken);
}

let lastLocation = null;
let currentSite = null;
let pendingCheckoutVisitId = null;
let pendingCheckoutFirstName = "";
let pendingCheckoutSite = "";

function resetDeviceAndRegister() {
  const confirmReset = confirm(
    "Backup action.\n\nThis will reset this device and return to first-time registration."
  );
  if (!confirmReset) return;

  localStorage.removeItem("mostlane_device_id");
  localStorage.removeItem("mostlane_last_checkin");
  localStorage.removeItem("mostlane_profile");

  location.reload();
}

/* ==============================
   ✅ BIG OVERLAY POPUP
   type: "in" | "out" | "reg"
============================== */
function showSuccessOverlay(type, siteName, firstName, durationText) {
  const overlay = document.getElementById("successOverlay");
  const icon = document.getElementById("successIcon");
  const title = document.getElementById("successTitle");
  const sub = document.getElementById("successSub");
  const site = document.getElementById("successSite");

  site.style.display = (siteName ? "inline-block" : "none");
  site.textContent = siteName ? siteName : "";

  if (type === "in") {
    icon.textContent = "✅";
    title.textContent = firstName ? `Welcome ${firstName}` : "Checked In";
    sub.textContent = siteName ? `Signed in at ${siteName}` : "You're signed in on site";
  } else if (type === "out") {
    icon.textContent = "👋";
    title.textContent = firstName ? `Goodbye ${firstName}` : "Checked Out";

    if (siteName && durationText) {
      sub.textContent = `Signed out from ${siteName} — ${durationText} on site`;
    } else if (durationText) {
      sub.textContent = `${durationText} on site`;
    } else {
      sub.textContent = "Visit completed";
    }
  } else {
    icon.textContent = "✅";
    title.textContent = "Registered";
    sub.textContent = "Check-in confirmed";
  }

  overlay.classList.add("active");
  overlay.setAttribute("aria-hidden", "false");

  try { if (navigator.vibrate) navigator.vibrate(70); } catch(e){}

  clearTimeout(window.__mlFadeT);
  clearTimeout(window.__mlCloseT);

  window.__mlFadeT = setTimeout(() => {
    overlay.classList.remove("active");
    overlay.setAttribute("aria-hidden", "true");
  }, 2000);

  window.__mlCloseT = setTimeout(() => {
    window.close();
  }, 10000);
}

function openSignOutConfirm(visitId, siteName, firstName) {
  pendingCheckoutVisitId = visitId;
  pendingCheckoutFirstName = firstName || "";
  pendingCheckoutSite = siteName || "";

  document.getElementById("confirmSignOutText").innerText =
    firstName
      ? `${firstName}, are you sure you want to sign out${siteName ? ` from ${siteName}` : ""}?`
      : `Are you sure you want to sign out${siteName ? ` from ${siteName}` : ""}?`;

  document.getElementById("confirmSignOutModal").style.display = "flex";
}

function closeSignOutConfirm() {
  document.getElementById("confirmSignOutModal").style.display = "none";
  pendingCheckoutVisitId = null;
  pendingCheckoutFirstName = "";
  pendingCheckoutSite = "";
}

async function confirmSignOutYes() {
  if (!pendingCheckoutVisitId) return;

  const firstName = pendingCheckoutFirstName;
  const siteName = pendingCheckoutSite;

  const res = await fetch(API + "/confirm-checkout", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      visitId: pendingCheckoutVisitId
    })
  });

  const data = await res.json();

  if (!res.ok || !data.ok) {
    alert(data.error || "Failed to sign out.");
    return;
  }

  const start = localStorage.getItem("mostlane_last_checkin");
  let durationText = "";

  if (start) {
    const mins = Math.round((Date.now() - start) / 60000);
    const hrs = Math.floor(mins / 60);
    const rem = mins % 60;
    durationText = hrs > 0 ? `${hrs}h ${rem}m` : `${mins}m`;
    localStorage.removeItem("mostlane_last_checkin");
  }

  document.getElementById("title").innerText = "👋 Checked Out";
  document.getElementById("status").innerText =
    firstName
      ? `Goodbye ${firstName} — Total time on site: ${durationText || "Recorded"}`
      : "Total time on site: " + (durationText || "Recorded");

  document.getElementById("noticeBox").innerHTML =
    "<strong>✅ Visit Complete:</strong> Thank you, you may now leave site.";

  closeSignOutConfirm();
  showSuccessOverlay("out", siteName, firstName, durationText);
}

function confirmSignOutNo() {
  closeSignOutConfirm();
  document.getElementById("title").innerText = "✅ Still Checked In";
  document.getElementById("status").innerText =
    "Sign out cancelled. You are still signed in on site.";
}

/* 🔒 LOCKED MAP VERSION */
function showMap(lat, lng) {
  const map = new google.maps.Map(document.getElementById("map"), {
    center: { lat, lng },
    zoom: 18,
    mapTypeId: "hybrid",
    disableDefaultUI: true,
    draggable: false,
    scrollwheel: false,
    disableDoubleClickZoom: true,
    keyboardShortcuts: false,
    gestureHandling: "none"
  });

  new google.maps.Marker({ position: { lat, lng }, map });
}

/* ======================================
   LOAD COMPANIES FOR SITE
======================================*/
async function loadCompaniesForSite(siteName) {
  try {
    const res = await fetch(API + "/companies-for-site?site=" + encodeURIComponent(siteName));
    const data = await res.json();

    const companySelect = document.getElementById("company");
    companySelect.innerHTML = `<option value="" disabled selected>Select from list</option>`;

    if (data.companies && data.companies.length > 0) {
      data.companies.forEach(c => {
        const option = document.createElement("option");
        option.value = c.name;
        option.textContent = c.name;
        companySelect.appendChild(option);
      });
    }

    const savedProfile = localStorage.getItem("mostlane_profile");
    if (savedProfile) {
      const profile = JSON.parse(savedProfile);
      const savedCompany = (profile.company || "").trim();
      if (savedCompany) {
        const exists = [...companySelect.options].some(o => o.value === savedCompany);
        if (exists) companySelect.value = savedCompany;
      }
    }

  } catch (err) {
    console.error("Company load failed:", err);
  }
}

async function scan() {
  const res = await fetch(API + "/scan", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      deviceToken,
      lat: lastLocation.lat,
      lng: lastLocation.lng,
      accuracy: lastLocation.accuracy
    })
  });

  const data = await res.json();
  const noticeBox = document.getElementById("noticeBox");

  if (data.status === "unknown_site") {
    document.getElementById("notYouRow").style.display = "none";
    document.getElementById("title").innerText = "❌ Unknown Site";
    document.getElementById("status").innerText =
      "You are not within range of an active Mostlane job.";
    return;
  }

  currentSite = data.site;

  await loadCompaniesForSite(currentSite);

  const firstName = data.firstName || "";
  const companyName = data.company || "";

  if (data.status === "first_visit") {
    document.getElementById("notYouRow").style.display = "none";
    document.getElementById("status").innerText =
      "First visit at " + currentSite + " — please register.";

    const savedProfile = localStorage.getItem("mostlane_profile");
    if (savedProfile) {
      const profile = JSON.parse(savedProfile);
      document.getElementById("firstName").value = profile.firstName || "";
      document.getElementById("lastName").value = profile.lastName || "";

      const savedPurpose = (profile.purpose || "").trim();
      if (savedPurpose === "Visiting" || savedPurpose === "Contractor") {
        document.getElementById("purpose").value = savedPurpose;
      } else {
        document.getElementById("purpose").value = "";
      }
    }

    document.getElementById("registerBox").style.display = "block";
    return;
  }

  if (data.status === "confirm_sign_out") {
    document.getElementById("notYouRow").style.display = "block";
    document.getElementById("title").innerText = "Confirm Sign Out";
    document.getElementById("status").innerText =
      firstName
        ? `${firstName}, please confirm if you want to sign out.`
        : "Please confirm if you want to sign out.";

    noticeBox.innerHTML =
      "<strong>⚠️ Confirmation Required:</strong> Please confirm before signing out.";

    openSignOutConfirm(data.visitId, currentSite, firstName);
    return;
  }

  if (data.status === "checked_in") {
    document.getElementById("notYouRow").style.display = "block";
    localStorage.setItem("mostlane_last_checkin", Date.now());

    document.getElementById("title").innerText = "✅ Checked In";
    document.getElementById("status").innerText =
      (firstName && companyName)
        ? `Welcome Back ${firstName} from ${companyName}`
        : "You are now on site: " + currentSite;

    noticeBox.innerHTML =
      "<strong>⚠️ Site Notice:</strong> Report to site foreman";

    showSuccessOverlay("in", currentSite, firstName);
    return;
  }

  if (data.status === "checked_out") {
    document.getElementById("notYouRow").style.display = "block";
    const start = localStorage.getItem("mostlane_last_checkin");

    let durationText = "";
    if (start) {
      const mins = Math.round((Date.now() - start) / 60000);
      const hrs = Math.floor(mins / 60);
      const rem = mins % 60;
      durationText = hrs > 0 ? `${hrs}h ${rem}m` : `${mins}m`;
      localStorage.removeItem("mostlane_last_checkin");
    }

    document.getElementById("title").innerText = "👋 Checked Out";
    document.getElementById("status").innerText =
      firstName
        ? `Goodbye ${firstName} — Total time on site: ${durationText || "Recorded"}`
        : "Total time on site: " + (durationText || "Recorded");

    noticeBox.innerHTML =
      "<strong>✅ Visit Complete:</strong> Thank you, you may now leave site.";

    showSuccessOverlay("out", currentSite, firstName, durationText);
    return;
  }
}

async function register() {
  const firstName = document.getElementById("firstName").value.trim();
  const lastName = document.getElementById("lastName").value.trim();
  const purpose = document.getElementById("purpose").value;
  const company = document.getElementById("company").value;
  const hsAck = document.getElementById("hsAck").checked;

  if (!firstName || !lastName || !purpose || !company || !hsAck) {
    alert("Complete all fields and confirm site rules.");
    return;
  }

  localStorage.setItem("mostlane_profile", JSON.stringify({
    firstName,
    lastName,
    purpose,
    company
  }));

  const res = await fetch(API + "/register", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      deviceToken,
      firstName,
      lastName,
      purpose,
      company,
      siteCode: currentSite,
      lat: lastLocation.lat,
      lng: lastLocation.lng,
      accuracy: lastLocation.accuracy
    })
  });

  const data = await res.json();

  if (!data.ok) {
    alert("Registration failed");
    return;
  }

  document.getElementById("registerBox").style.display = "none";

  await scan();

  window.scrollTo({ top: 0, behavior: "smooth" });
}

function startLocation() {
  navigator.geolocation.getCurrentPosition(
    (pos) => {
      lastLocation = {
        lat: pos.coords.latitude,
        lng: pos.coords.longitude,
        accuracy: pos.coords.accuracy
      };

      showMap(lastLocation.lat, lastLocation.lng);
      scan();
    },
    (err) => {
      document.getElementById("status").innerText =
        "Location required: " + err.message;
    },
    { enableHighAccuracy: true, timeout: 20000 }
  );
}

if (navigator.permissions && navigator.permissions.query) {
  navigator.permissions.query({ name: "geolocation" }).then((result) => {
    if (result.state === "granted" || result.state === "prompt") {
      startLocation();
    } else {
      document.getElementById("status").innerText =
        "Location access is required. Please enable it in your browser settings.";
    }
  }).catch(() => startLocation());
} else {
  startLocation();
}
</script>

</body>
</html>
